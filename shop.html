<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse. — Shop Collection</title>
  <meta name="description" content="Explore our collection of minimalist Algerian unisex streetwear.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="header-container"></div>
  
  <section style="padding: 60px 0 30px; border-bottom: var(--border-heavy); background: var(--color-bg);">
    <div class="container">
      <span style="font-size:11px; font-weight:900; letter-spacing:3px; text-transform:uppercase;" data-i18n="allDrops">[ ALL DROPS ]</span>
      <h1 style="font-size: clamp(36px, 5vw, 64px); font-weight: 900; text-transform: uppercase; margin-top: 8px;" data-i18n="viewCatalog">UNISEX CATALOG.</h1>
    </div>
  </section>

  <main class="container" style="padding: 40px 24px 90px;">
    <div class="filter-bar">
      <div class="filter-bar__categories" id="category-filters"></div>
      <select class="form-select" id="sort-select" style="width:auto; max-width: 200px;">
        <option value="newest" data-i18n="sortNewest">Sort: Newest Drops</option>
        <option value="price-low" data-i18n="sortLow">Price: Low to High</option>
        <option value="price-high" data-i18n="sortHigh">Price: High to Low</option>
      </select>
    </div>
    
    <div class="product-grid" id="shop-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none; text-align:center; padding:80px 0; font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--color-text-muted);" data-i18n="noDropsFound">
      No drops found in this category.
    </div>
  </main>

  <div class="modal-overlay" id="quick-view-modal">
    <div class="modal">
      <button class="modal__close" onclick="closeQuickView()">×</button>
      <div class="quick-view" id="quick-view-content"></div>
    </div>
  </div>

  <div id="footer-container"></div>
  <div id="cart-sidebar-container"></div>
  <div id="notification-container"></div>
  
  <script src="/js/store.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if(window.EclipseStore) EclipseStore.init();
      if(window.EclipseApp) EclipseApp.initPage();
    });
  </script>
</body>
</html>
